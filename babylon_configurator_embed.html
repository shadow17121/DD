<!-- 📦 Babylon.js Configurator Template -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Configurator</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(255,255,255,0.9);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .button { margin: 0.25rem 0; padding: 0.5rem; cursor: pointer; background: #007cba; color: white; border: none; border-radius: 4px; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <button class="button" onclick="setColor('red')">Rood</button>
    <button class="button" onclick="setColor('blue')">Blauw</button>
    <button class="button" onclick="setColor('green')">Groen</button>
  </div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);

      const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI / 2, Math.PI / 2.5, 4, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);

      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);

      const box = BABYLON.MeshBuilder.CreateBox("product", {}, scene);
      const material = new BABYLON.StandardMaterial("mat", scene);
      box.material = material;

      window.setColor = (color) => {
        material.diffuseColor = BABYLON.Color3.FromHexString(colorMap[color]);
      };

      return scene;
    };

    const colorMap = {
      red: "#d7263d",
      blue: "#1e56a0",
      green: "#3ebd93"
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
