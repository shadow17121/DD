<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Configurator - Hosted GLB</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(255,255,255,0.9);
      padding: 1rem;
      border-radius: 8px;
    }
    .button {
      margin: 0.25rem 0;
      padding: 0.5rem;
      cursor: pointer;
      background: #007cba;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <button class="button" onclick="setColor('red')">Rood</button>
    <button class="button" onclick="setColor('blue')">Blauw</button>
    <button class="button" onclick="setColor('green')">Groen</button>
  </div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    let targetMesh = null;

    const colorMap = {
      red: "#d7263d",
      blue: "#1e56a0",
      green: "#3ebd93"
    };

    const createScene = async () => {
      const scene = new BABYLON.Scene(engine);
      const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2.5, 4, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);

      // Load your externally hosted GLB model
      await BABYLON.SceneLoader.ImportMeshAsync(
        "", 
        "", 
        "https://raw.githubusercontent.com/shadow17121/DD/main/1Untitled.glb", 
        scene
      ).then((result) => {
        targetMesh = result.meshes[0];
        scene.createDefaultEnvironment();
      });

      return scene;
    };

    // Change mesh color
    window.setColor = (color) => {
      if (targetMesh && targetMesh.material) {
        targetMesh.material.diffuseColor = BABYLON.Color3.FromHexString(colorMap[color]);
      }
    };

    createScene().then((scene) => {
      engine.runRenderLoop(() => scene.render());
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
