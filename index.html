<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Configurator - Babylon.js</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: white; }
    canvas { width: 800px; height: 800px; display: block; }
    #ui {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(255,255,255,0.95);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .button {
      margin: 0.25rem 0;
      padding: 0.5rem;
      cursor: pointer;
      background: #007cba;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <button class="button" onclick="setColor('red')">Rood</button>
    <button class="button" onclick="setColor('blue')">Blauw</button>
    <button class="button" onclick="setColor('green')">Groen</button>
  </div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    engine.setHardwareScalingLevel(1 / window.devicePixelRatio);

    let targetMesh = null;

    const colorMap = {
      red: "#d7263d",
      blue: "#1e56a0",
      green: "#3ebd93"
    };

    const createScene = async () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(1, 1, 1, 1); // witte achtergrond

      const target = new BABYLON.Vector3(0, 0.8, 0); // model lager in beeld

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,
        Math.PI / 2.5,
        22, // zoomniveau
        target,
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = camera.upperRadiusLimit = camera.radius;

      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);
      light.intensity = 0.9;

      await BABYLON.SceneLoader.ImportMeshAsync(
        "", 
        "", 
        "https://raw.githubusercontent.com/shadow17121/DD/main/1Untitled.glb", 
        scene
      ).then((result) => {
        targetMesh = result.meshes[0];

        targetMesh.getChildMeshes().forEach(mesh => {
          if (mesh.material && mesh.material.albedoTexture) {
            mesh.material.albedoTexture.level = 2.0;
            mesh.material.albedoTexture.updateSamplingMode(BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
          }
        });
      });

      const fxaa = new BABYLON.DefaultRenderingPipeline("defaultPipeline", true, scene, [camera]);
      fxaa.fxaaEnabled = true;

      return scene;
    };

    window.setColor = (color) => {
      if (targetMesh && targetMesh.material) {
        targetMesh.material.diffuseColor = BABYLON.Color3.FromHexString(colorMap[color]);
      }
    };

    createScene().then((scene) => {
      engine.runRenderLoop(() => scene.render());
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
